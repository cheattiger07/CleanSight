{% extends "auth_base.html" %}
{% block title %}Confirming payment · CleanSight{% endblock %}
{% block content %}
  <p class="cs-sub" id="msg">Confirming your payment…</p>
  <script>
    var tries = 0;
    function check() {
      fetch("/billing/status", { credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.paid) { window.location.href = "/billing"; return; }
          if (++tries >= 30) {
            document.getElementById("msg").textContent =
              "Payment received. Your plan can take a minute to update. Refresh shortly.";
            return;
          }
          setTimeout(check, 2000);
        })
        .catch(function () { setTimeout(check, 3000); });
    }
    check();
  </script>
{% endblock %}
