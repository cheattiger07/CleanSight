{% extends "auth_base.html" %}
{% block title %}Log in · CleanSight{% endblock %}
{% block content %}
  <p class="cs-sub">Welcome back. L
    +og in to clean your data.</p>
  <form method="POST" action="/login">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@company.com" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Your password" required>

    <button type="submit">Log in</button>
  </form>
  <p class="switch">New here? <a href="/signup">Create an account</a></p>
{% endblock %}
