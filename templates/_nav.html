<style>
  body { padding-top: 56px !important; }
  .cs-nav {
    position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 1000;
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 0 16px;
    background: rgba(8,11,18,0.92); border-bottom: 0.5px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    font-family: 'Outfit', sans-serif; font-size: 13px;
  }
  .cs-nav-user {
    color: #9ca3af; max-width: 220px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding: 6px 10px;
  }
  .cs-nav-btn {
    color: #e5e7eb; text-decoration: none; padding: 6px 12px; border-radius: 8px;
    background: rgba(15,17,23,0.85); border: 0.5px solid rgba(255,255,255,0.15);
    transition: border-color .15s, opacity .15s;
  }
  .cs-nav-btn:hover { border-color: #3b82f6; }
  .cs-nav-btn.primary { background: linear-gradient(135deg,#1e3a8a,#3b82f6); border-color: transparent; color: #fff; }
  @media (max-width: 520px) { .cs-nav-user { display: none; } }
</style>
<nav class="cs-nav">
  {% if current_user.is_authenticated %}
    <span class="cs-nav-user">{{ current_user.email }}</span>
    <a href="/" class="cs-nav-btn">New file</a>
    <form method="POST" action="/logout" style="margin:0;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="cs-nav-btn" style="cursor:pointer; font-family:inherit; font-size:inherit;">Log out</button>
</form>
  {% else %}
    <a href="/login" class="cs-nav-btn">Log in</a>
    <a href="/signup" class="cs-nav-btn primary">Sign up</a>
  {% endif %}
</nav>
{% if current_user.is_authenticated and not current_user.email_verified %}
<style>
  body { padding-top: 100px !important; }
  .cs-verify-banner {
    position: fixed; top: 48px; left: 0; right: 0; height: 40px; z-index: 999;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff4e0; color: #854f0b; border-bottom: 1px solid #f5d08a;
    font-family: 'Outfit', sans-serif; font-size: 13px; padding: 0 12px;
  }
  .cs-verify-banner form { margin: 0; }
  .cs-verify-banner button {
    background: none; border: none; padding: 0; cursor: pointer;
    color: #854f0b; font: inherit; text-decoration: underline;
  }
</style>
<div class="cs-verify-banner">
  <span>Please verify your email to start cleaning data.</span>
  <form method="POST" action="/resend-verification">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Resend email</button>
  </form>
</div>
{% endif %}
