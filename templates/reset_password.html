{% extends "auth_base.html" %}
{% block title %}Reset password · CleanSight{% endblock %}
{% block content %}
  <p class="cs-sub">Choose a new password for your account.</p>
  <form method="POST" action="/reset-password/{{ token }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required autofocus>
    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" minlength="8" required>
    <button type="submit">Update password</button>
  </form>
{% endblock %}
