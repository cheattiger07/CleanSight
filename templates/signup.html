{% extends "auth_base.html" %}
{% block title %}Sign up · CleanSight{% endblock %}
{% block content %}
  <p class="cs-sub">Create your account to upload and clean datasets.</p>
  <form method="POST" action="/signup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@company.com" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" minlength="8" required>

    <button type="submit">Create account</button>
  </form>
  <p class="switch">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
