{% extends "auth_base.html" %}
{% block title %}Forgot password · CleanSight{% endblock %}
{% block content %}
  <p class="cs-sub">Enter your email and we'll send you a link to reset your password.</p>
  <form method="POST" action="/forgot-password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@company.com" required autofocus>
    <button type="submit">Send reset link</button>
  </form>
  <p class="switch"><a href="/login">Back to log in</a></p>
{% endblock %}
